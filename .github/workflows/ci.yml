name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # npm 11 to match the lockfile: npm 10 resolves next-intl's optional
      # @swc/helpers peer differently and rejects the lockfile as out of sync.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # tsc and eslint both pass on code that can't ship: a failing
      # generateStaticParams, or server-only code pulled into a client
      # component, only surfaces when the production build runs.
      - name: Build
        run: npm run build
